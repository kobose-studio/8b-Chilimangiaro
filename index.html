<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>DISCOLOW | 8B - Jazz Dubstep & AI Music Fusion</title>
    <meta name="description" content="DISCOLOW è il progetto sperimentale di 8B. Jazz, Dubstep e Liquid Fusion creati attraverso l'interazione tra uomo e IA.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@300;400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --bg-dim: rgba(5, 5, 5, 0.95);
        }

        body, html {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Canvas Background - Rogue Engine */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw; /* Forzato al viewport width */
            height: 100vh; /* Forzato al viewport height */
            z-index: 1;
            pointer-events: none; /* Lascia passare i click agli elementi sotto */
        }

        /* Navigazione Superiore */
        .top-nav {
            position: fixed;
            top: 2.5rem;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 3rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            z-index: 100;
            font-weight: 400;
        }

        .nav-link {
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.4;
            position: relative;
        }

        .nav-link.active, .nav-link:hover {
            opacity: 1;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 1px;
            background: #fff;
        }

        /* Control Panel - Rogue Aesthetic [8B] */
        #settings-panel {
            position: fixed;
            right: -300px;
            top: 50%;
            transform: translateY(-50%);
            width: 280px;
            background: var(--bg-dim);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem 1.5rem;
            z-index: 150;
            transition: right 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(15px);
            font-family: 'Space Mono', monospace;
        }

        #settings-panel.open {
            right: 0;
        }

        .settings-toggle {
            position: absolute;
            left: -45px;
            top: 0;
            background: var(--bg-dim);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-right: none;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.7rem;
            transition: color 0.3s ease;
        }

        .settings-toggle:hover { color: #fff; }

        .setting-group { margin-bottom: 1.8rem; }
        .setting-label {
            display: block; font-size: 0.6rem; text-transform: uppercase;
            letter-spacing: 0.1em; margin-bottom: 0.8rem; color: rgba(255, 255, 255, 0.5);
        }
        .setting-label span { color: #fff; float: right; }

        input[type=range] {
            width: 100%; background: transparent; -webkit-appearance: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 1px; background: rgba(255, 255, 255, 0.1);
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 10px; width: 10px;
            background: #fff; cursor: pointer; margin-top: -4.5px;
        }

        /* Sezioni Contenuto */
        .content-section {
            display: none !important;
            height: 100vh; width: 100%; padding: 2rem;
            flex-direction: column; justify-content: center; align-items: center;
            position: absolute; top: 0; left: 0; z-index: 10;
            pointer-events: none; /* Cruciale per far passare i click sotto */
            overflow-y: auto;
        }
        .content-section.active { display: flex !important; animation: sectionFade 0.8s ease forwards; }
        .content-section * { pointer-events: all; } /* Riattiva i click sui bottoni interni */

        @keyframes sectionFade {
            from { opacity: 0; filter: blur(5px); }
            to { opacity: 1; filter: blur(0); }
        }

        .title-giant {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: clamp(4rem, 20vw, 13rem);
            letter-spacing: -0.05em;
            line-height: 0.8;
            text-transform: uppercase;
            text-align: center;
        }
        
        .magma-subtitle {
            margin-top: 1rem;
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            letter-spacing: 0.3em;
            color: #D64933; /* Rosso Magma */
            text-transform: uppercase;
        }

        /* Pubblicazioni */
        .artwork-box {
            width: 100%; max-width: 300px; aspect-ratio: 1/1;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px; background: rgba(255,255,255,0.02); margin-bottom: 2rem;
        }
        .artwork-box img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: 0.5s; }
        .artwork-box:hover img { filter: grayscale(0%); }

        /* Footer Ristrutturato per fix link */
        .bottom-nav {
            position: fixed; 
            bottom: 0; 
            left: 0;
            width: 100%; 
            padding: 2.5rem 3rem;
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; /* Allineati in basso */
            font-size: 0.7rem; 
            text-transform: uppercase; 
            letter-spacing: 0.15em; 
            z-index: 100;
            pointer-events: none; /* Il contenitore non blocca il mouse... */
        }
        
        .bottom-nav > * {
            pointer-events: auto; /* ...ma gli elementi dentro sì! */
        }

        .footer-link-box {
            flex: 1;
            display: flex;
        }
        
        .footer-link-box.left { justify-content: flex-start; }
        .footer-link-box.right { justify-content: flex-end; }
        .footer-link-box.center { justify-content: center; flex: 0; }

        .footer-link {
            opacity: 0.4;
            transition: opacity 0.3s;
            text-decoration: none;
            color: #fff;
        }
        .footer-link:hover { opacity: 1; color: #D64933;} /* Hover rosso */

        .audio-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .audio-status-label { font-size: 0.55rem; opacity: 0.4; letter-spacing: 0.2em; }
        .audio-control {
            cursor: pointer; padding: 12px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }

        .playing .bar { animation: sound 0.5s infinite ease-in-out alternate; }
        .bar { width: 2px; height: 10px; background: white; margin: 0 1.5px; display: inline-block; }

        @keyframes sound { 0% { height: 4px; } 100% { height: 14px; } }

        @media (max-width: 768px) {
            .top-nav { gap: 1.5rem; font-size: 0.6rem; }
            .bottom-nav { flex-direction: column; align-items: center; gap: 1.5rem; padding: 1.5rem; }
            .footer-link-box { justify-content: center !important; }
            .title-giant { font-size: 5rem; line-height: 0.9; }
        }
    </style>
</head>
<body>

    <div id="interaction-layer" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:2; pointer-events:all;"></div>
    
    <canvas id="particleCanvas"></canvas>

    <nav class="top-nav">
        <span class="nav-link active" onclick="showSection('home')">DISCOLOW</span>
        <span class="nav-link" onclick="showSection('manifesto')">Manifesto</span>
        <span class="nav-link" onclick="showSection('pubblicazioni')">LOG</span>
    </nav>

    <div id="settings-panel">
        <div class="settings-toggle" onclick="toggleSettings()">[8B]</div>
        <h2 class="text-[0.6rem] uppercase tracking-[0.3em] mb-8 border-b border-white/10 pb-2 text-white/40">8BINARY ARCHEOLOGY</h2>
        
        <div class="setting-group">
            <label class="setting-label">Binary Dust <span id="val-density">120</span></label>
            <input type="range" id="param-density" min="20" max="400" value="120" oninput="updateParams()">
        </div>

        <div class="setting-group">
            <label class="setting-label">Signal Conflict <span id="val-repulsion">180</span></label>
            <input type="range" id="param-repulsion" min="50" max="500" value="180" oninput="updateParams()">
        </div>

        <div class="setting-group">
            <label class="setting-label">Clock Jitter <span id="val-friction">95</span></label>
            <input type="range" id="param-friction" min="70" max="99" value="95" oninput="updateParams()">
        </div>

        <div class="setting-group">
            <label class="setting-label">Amplitude Overload <span id="val-size">6</span></label>
            <input type="range" id="param-size" min="1" max="25" value="6" oninput="updateParams()">
        </div>
        
        <button onclick="resetParticles()" class="w-full text-[0.55rem] uppercase tracking-[0.2em] border border-white/10 py-3 mt-4 hover:bg-white hover:text-black transition-all">REBOOT 0/1</button>
        
    </div>

    <section id="home" class="content-section active">
        <h1 class="title-giant">
            <span class="block">DISCO</span>
            <span class="block">LOW</span>
        </h1>
        <div class="magma-subtitle">magma roots ensemble</div>
    </section>

    <section id="manifesto" class="content-section">
         <div class="max-w-2xl text-center px-6 py-20">
            <p class="text-[10px] tracking-[0.6em] mb-12 opacity-30 uppercase font-bold font-mono">[ MANIFESTO: 8B.INARY ]</p>
            <div class="space-y-12">
                <p class="text-xl sm:text-2xl font-light leading-relaxed tracking-tight">DISCOLOW non è un progetto, è un’<span class="font-bold">insurrezione armonica</span>...</p>
            </div>
        </div>
    </section>

    <section id="pubblicazioni" class="content-section">
        <div class="flex flex-col items-center">
            <div class="artwork-box"><img src="Jungle-Fu_Discolow_AW.jpg" alt="Jungle-Fu Cover"></div>
            <div class="text-center font-family-mono">
                <h3 class="font-bold tracking-[0.4em] uppercase text-xs mb-2">Jungle Fusion</h3>
            </div>
        </div>
    </section>

    <footer class="bottom-nav">
        <div class="footer-link-box left">
            <a href="mailto:info@chilimangiaro.com" class="footer-link">mail @chilimangiaro</a>
        </div>

        <div class="footer-link-box center">
            <div class="audio-wrapper">
                <div id="audio-btn" class="audio-control opacity-40" onclick="toggleAudio()">
                    <div id="visualizer" class="flex items-end h-3">
                        <span class="bar" style="animation-delay: 0.1s"></span>
                        <span class="bar" style="animation-delay: 0.3s"></span>
                        <span class="bar" style="animation-delay: 0.2s"></span>
                    </div>
                </div>
                <span id="audio-label" class="audio-status-label">DISCO OFF</span>
            </div>
        </div>

        <div class="footer-link-box right">
            <a href="https://www.instagram.com/disco_low" target="_blank" class="footer-link">Instagram</a>
        </div>
    </footer>

    <audio id="bg-audio" loop preload="auto">
        <source src="Discolow_Jungle-Fu.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Logica Sezioni
        function showSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            
            document.getElementById(sectionId).classList.add('active');
            const links = document.querySelectorAll('.nav-link');
            if(sectionId === 'home') links[0].classList.add('active');
            if(sectionId === 'manifesto') links[1].classList.add('active');
            if(sectionId === 'pubblicazioni') links[2].classList.add('active');
        }

        // Engine Particelle Geometriche ROSSE e visibili!
        let config = {
            numParticles: 150, // Aumentate
            repulsionDistance: 250, // Area di interazione mouse più grande
            repulsionStrength: 0.6,
            friction: 0.95,
            maxSize: 8
        };

        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        // Impostiamo il mouse al centro fin dall'inizio
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Aggiorniamo il centro se la finestra cambia
            if(mouseX === null) mouseX = canvas.width / 2;
            if(mouseY === null) mouseY = canvas.height / 2;
        }
        window.addEventListener('resize', resize);
        
        // Risoluzione glitch #2: Forziamo il resize subitissimo
        setTimeout(resize, 50);

        const platonicSolids = [ { sides: 3 }, { sides: 4 }, { sides: 6 } ];

        function drawPolygon(ctx, x, y, radius, sides) {
            ctx.beginPath();
            const angleStep = (Math.PI * 2) / sides;
            let angle = -Math.PI / 2;
            ctx.moveTo(x + radius * Math.cos(angle), y + radius * Math.sin(angle));
            for (let i = 1; i < sides; i++) {
                angle += angleStep;
                ctx.lineTo(x + radius * Math.cos(angle), y + radius * Math.sin(angle));
            }
            ctx.closePath();
            ctx.fill();
        }

        class Particle {
            constructor() { this.init(); }
            init() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.size = Math.random() * config.maxSize + 2;
                this.velocityX = (Math.random() - 0.5) * 2;
                this.velocityY = (Math.random() - 0.5) * 2;
                // Partono già visibili
                this.alpha = Math.random() * 0.5 + 0.2; 
                this.sides = platonicSolids[Math.floor(Math.random() * platonicSolids.length)].sides;
            }
            update() {
                // Interazione fissa su tutto lo schermo
                let dx = this.x - mouseX;
                let dy = this.y - mouseY;
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < config.repulsionDistance) {
                    let force = (config.repulsionDistance - distance) / config.repulsionDistance;
                    this.velocityX += (dx / distance) * force * config.repulsionStrength;
                    this.velocityY += (dy / distance) * force * config.repulsionStrength;
                    // Diventano più luminose vicino al mouse
                    this.alpha = 0.8; 
                } else {
                    // Tornano lente all'opacità base
                    if(this.alpha > 0.3) this.alpha -= 0.01;
                }

                this.x += this.velocityX;
                this.y += this.velocityY;
                this.velocityX *= config.friction;
                this.velocityY *= config.friction;

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                // IL ROSSO MAGMA - rgb(214, 73, 51) == #D64933
                ctx.fillStyle = `rgba(214, 73, 51, ${this.alpha})`;
                drawPolygon(ctx, this.x, this.y, this.size, this.sides);
            }
        }

        function resetParticles() {
            particles = [];
            resize(); // Forziamo ricalcolo dimensioni prima di crearle
            for (let i = 0; i < config.numParticles; i++) particles.push(new Particle());
        }

        // Il layer interattivo cattura il mouse perfettamente ovunque
        document.getElementById('interaction-layer').addEventListener('mousemove', (e) => { 
            mouseX = e.clientX; 
            mouseY = e.clientY; 
        });

        function toggleSettings() { document.getElementById('settings-panel').classList.toggle('open'); }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        // Inizializzazione corretta
        window.onload = () => {
            resize();
            resetParticles();
            animate();
        };

        // Audio Management (invariato)
        const audio = document.getElementById('bg-audio');
        const audioBtn = document.getElementById('audio-btn');
        const visualizer = document.getElementById('visualizer');
        const audioLabel = document.getElementById('audio-label');
        let isPlaying = false;

        function toggleAudio() {
            if (isPlaying) {
                audio.pause();
                visualizer.classList.remove('playing');
                audioBtn.style.opacity = "0.4";
                audioLabel.innerText = "DISCO OFF";
            } else {
                audio.play().catch(e => console.log("Blocked"));
                visualizer.classList.add('playing');
                audioBtn.style.opacity = "1";
                audioLabel.innerText = "DISCO ON";
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
